    const decoded = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const page = await new Response(decoded).text();
    if (!page.trimStart().toLowerCase().startsWith('<!doctype html>')) throw new Error('Не удалось проверить содержимое теста.');
    document.open(); document.write(page); document.close();
  } catch (error) {
    status.textContent = 'Не удалось открыть тест: ' + (error?.message || String(error));
  }
})();
</script></body></html>
